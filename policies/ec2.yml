policies:
  - name: ec2-ebs-default-encryption
    resource: aws.account
    description: EBS 기본 암호화가 비활성화된 리전을 탐지하고, set-ebs-encryption으로 이후 생성되는 볼륨의 기본 암호화를 활성화한다.
    filters:
      - type: default-ebs-encryption
        state: false
    actions:
      - type: set-ebs-encryption
        state: true
    metadata:
      prowler_check: ec2_ebs_default_encryption
      approve:
        disruption: none
        blast_radius: region
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: 계정/리전 EBS 기본 암호화 설정 변경 - 조직이 전체 암호화 정책일 때만 승격 권장
      auto:
        warning:
          "Auto 활성화 시 opt-in한 리전에서 동일 위반이 다시 탐지되면 사용자 승인 없이 EBS 기본 암호화가 자동으로 활성화됩니다. 기존 볼륨에는 적용되지 않습니다.

          "
        allowed_scopes:
          - region
        rollback_cli: aws ec2 disable-ebs-encryption-by-default --region {region}
        cooldown: 24h
        post_notification: log

  - name: ec2-ebs-volume-snapshots-exists
    resource: aws.ebs
    description: Snapshot이 없는 EBS Volume을 탐지하고, snapshot action으로 해당 Volume의 Snapshot을 생성한다.
    filters:
      - type: snapshots
        count: 0
        count_op: eq
    actions:
      - type: snapshot
        copy-volume-tags: true
        tags:
          custodian_snapshot: "true"
    metadata:
      prowler_check: ec2_ebs_volume_snapshots_exists
      approve:
        disruption: none
        blast_radius: resource
        propagation_delay: minutes
        reversible: true
        cost_impact: low
        risk_note: EBS Snapshot 생성은 가능하지만 Snapshot 저장에 추가 비용이 발생하므로 승인 후 실행한다
      auto:
        warning:
          "Auto 활성화 시 opt-in한 EBS Volume에서 동일 위반이 다시 탐지되면 사용자 승인 없이 Snapshot이 자동으로 생성됩니다. Snapshot 저장 비용이 발생할 수 있습니다.

          "
        allowed_scopes:
          - resource
        rollback_cli: null
        cooldown: 24h
        post_notification: log

  - name: ec2-instance-account-imdsv2-enabled
    resource: aws.account
    description: 리전의 EC2 Metadata 기본 HttpTokens가 required가 아닌 상태를 탐지하고, set-ec2-metadata-defaults로 required로 변경한다.
    filters:
      - or:
          - type: ec2-metadata-defaults
            key: HttpTokens
            value: optional
          - type: ec2-metadata-defaults
            key: HttpTokens
            value: absent
    actions:
      - type: set-ec2-metadata-defaults
        HttpTokens: required
    metadata:
      prowler_check: ec2_instance_account_imdsv2_enabled
      approve:
        disruption: none
        blast_radius: region
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: 계정 IMDS 기본값 변경 - 조직이 IMDSv2 강제 정책일 때만 승격 권장
      auto:
        warning:
          "Auto 활성화 시 opt-in한 리전에서 동일 위반이 다시 탐지되면 사용자 승인 없이 EC2 Metadata 기본값이 IMDSv2 강제로 자동 변경됩니다. 기존 인스턴스에는 소급 적용되지 않습니다.

          "
        allowed_scopes:
          - region
        rollback_cli: null
        cooldown: 24h
        post_notification: log

  - name: ec2-instance-imdsv2-enabled
    resource: aws.ec2
    description: HttpTokens가 optional인 EC2 Instance를 탐지하고, set-metadata-access로 IMDSv2 토큰을 required로 변경한다.
    filters:
      - MetadataOptions.HttpEndpoint: enabled
      - MetadataOptions.HttpTokens: optional
    actions:
      - type: set-metadata-access
        tokens: required
    metadata:
      prowler_check: ec2_instance_imdsv2_enabled
      approve:
        disruption: access
        blast_radius: resource
        propagation_delay: seconds
        reversible: true
        cost_impact: none
        risk_note: 기존 애플리케이션이나 SDK가 IMDSv1에 의존하는지 자동으로 확인할 수 없어 호환성 영향을 배제할 수 없으므로 승인 후 실행한다
 
  - name: ec2-instance-detailed-monitoring-enabled
    resource: aws.ec2
    description: Detailed Monitoring이 비활성화된 EC2 Instance를 탐지하고, set-monitoring으로 활성화한다.
    filters:
      - Monitoring.State: disabled
    actions:
      - type: set-monitoring
        state: enable
    metadata:
      prowler_check: ec2_instance_detailed_monitoring_enabled
      approve:
        disruption: none
        blast_radius: resource
        propagation_delay: minutes
        reversible: true
        cost_impact: low
        risk_note: EC2 Detailed Monitoring 활성화는 서비스 중단 없이 가능하지만 CloudWatch Metric에 따른 추가 비용이 발생하므로 승인 후 실행한다
      auto:
        warning:
          "Auto 활성화 시 opt-in한 EC2 Instance에서 동일 위반이 다시 탐지되면 사용자 승인 없이 Detailed Monitoring이 자동으로 활성화됩니다. CloudWatch Metric 비용이 발생할 수 있습니다.

          "
        allowed_scopes:
          - resource
        rollback_cli: aws ec2 unmonitor-instances --instance-ids {instance_id}
        cooldown: 24h
        post_notification: log
        
