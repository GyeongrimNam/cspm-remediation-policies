policies:
  - name: iam-password-policy-lowercase
    resource: aws.account
    description: 소문자 요구가 비활성화된 IAM Password Policy를 탐지하고, set-password-policy로 RequireLowercaseCharacters를 활성화한다.
    filters:
      - or:
          - type: password-policy
            key: PasswordPolicyConfigured
            value: false
          - type: password-policy
            key: RequireLowercaseCharacters
            value: false
    actions:
      - type: set-password-policy
        policy:
          RequireLowercaseCharacters: true
    metadata:
      prowler_check: iam_password_policy_lowercase
      approve:
        disruption: none
        blast_radius: account
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: IAM 계정 전체 Password Policy 변경 - 조직이 IAM 보안 baseline 정책을 운영할 때만 승격 권장
      auto:
        warning:
          "Auto 활성화 시 opt-in한 계정에서 동일 위반이 다시 탐지되면 사용자 승인 없이 해당 IAM Password Policy 요구 조건이 자동으로 적용됩니다. 이후 비밀번호 변경 시 새 요구사항이 적용될 수 있습니다.

          "
        allowed_scopes:
          - account
        rollback_cli: null
        cooldown: 24h
        post_notification: log

  - name: iam-password-policy-minimum-length-14
    resource: aws.account
    description: 최소 길이가 14자 미만인 IAM Password Policy를 탐지하고, set-password-policy로 MinimumPasswordLength를 14로 설정한다.
