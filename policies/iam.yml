  - name: iam-password-policy-expires-passwords-within-90-days-or-less
    resource: aws.account
    description: IAM Password Policy의 MaxPasswordAge가 없거나 90일을 초과한 계정을 탐지하고, set-password-policy로 최대 사용 기간을 90일로 설정한다.
    filters:
      - or:
          - type: password-policy
            key: MaxPasswordAge
            value: absent
          - type: password-policy
            key: MaxPasswordAge
            value: 90
            op: gt
    actions:
      - type: set-password-policy
        policy:
          MaxPasswordAge: 90
    metadata:
      prowler_check: iam_password_policy_expires_passwords_within_90_days_or_less
      approve:
        disruption: access
        blast_radius: account
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: Password 만료 정책을 90일로 설정하면 오래된 비밀번호를 사용하는 IAM User에게 비밀번호 변경이 요구될 수 있어 사용자 접근에 영향을 줄 수 있으므로 승인 후 실행한다
