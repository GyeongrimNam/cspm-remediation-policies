  # ----------------------------------------------------------
  # iam_password_policy_reuse_24
  # ----------------------------------------------------------

  - name: iam-password-policy-reuse-24
    resource: aws.account

    description: >
      IAM 계정 Password Policy 의 이전 비밀번호 재사용 방지가
      최근 24개 미만으로 설정된 계정

    filters:
      - or:
          - type: password-policy
            key: PasswordReusePrevention
            value: absent

          - type: password-policy
            key: PasswordReusePrevention
            value: 24
            op: lt

    actions:
      - type: set-password-policy
        policy:
          PasswordReusePrevention: 24

    metadata:
      prowler_check: iam_password_policy_reuse_24

      approve:
        disruption: none
        blast_radius: account
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: >-
          IAM 계정 전체 Password Policy 변경 - 조직이 IAM 보안 baseline 정책을 운영할 때만 승격 권장

