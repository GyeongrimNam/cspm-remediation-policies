# ============================================================
# IAM 정책 모음
# ============================================================
# 실행 구조:
# DB check_id
#   → mapping.yml에서 policy 조회
#   → Python 오케스트레이터가 해당 Custodian policy 실행
#   → Prowler에서 동일 check_id 재검사
#
# IAM Password Policy 6개는 하나의 계정 Password Policy를 공유하지만,
# set-password-policy는 지정한 항목만 변경하므로 check_id별 정책 분리가 가능하다.
#
# 계정 단위 설정이므로 blast_radius는 account이며,
# 기존 로그인/비밀번호를 즉시 차단하지 않아 disruption은 none으로 설정한다.
# ============================================================


policies:

  # ----------------------------------------------------------
  # iam_password_policy_lowercase
  # ----------------------------------------------------------

  - name: iam-password-policy-lowercase
    resource: aws.account

    description: >
      IAM 계정 Password Policy 의 소문자 요구 조건이
      활성화되어 있지 않은 계정

    filters:
      - type: password-policy
        key: RequireLowercaseCharacters
        value: false

    actions:
      - type: set-password-policy
        policy:
          RequireLowercaseCharacters: true

    metadata:
      prowler_check: iam_password_policy_lowercase

      approve:
        disruption: none
        blast_radius: account
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: >-
          IAM 계정 전체 Password Policy 변경 - 조직이 IAM 보안 baseline 정책을 운영할 때만 승격 권장

      auto:
        warning: >
          Auto 활성화 시 opt-in한 계정에서 동일 위반이 다시 탐지되면 사용자 승인 없이 해당 IAM Password Policy 요구 조건이 자동으로 적용됩니다. 이후 비밀번호 변경 시 새 요구사항이 적용될 수 있습니다.
        allowed_scopes:
          - account
        rollback_cli: null
        cooldown: 24h
        post_notification: log


  # ----------------------------------------------------------
  # iam_password_policy_minimum_length_14
  # ----------------------------------------------------------

  - name: iam-password-policy-minimum-length-14
    resource: aws.account

    description: >
